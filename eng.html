<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Tense Builder (英语时态积木墙)</title>
    <style>
        :root {
            --primary-bg: #f0f2f5;
            --time-color: #3498db;
            --aspect-color: #e67e22;
            --correct-color: #27ae60;
            --wrong-color: #c0392b;
            --text-color: #2c3e50;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 650px;
            text-align: center;
        }

        h1 { margin-top: 0; color: #34495e; font-size: 1.5rem; }
        
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 1rem;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .mode-btn {
            background: none;
            border: 2px solid #bdc3c7;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            color: #7f8c8d;
            transition: all 0.3s;
        }

        .mode-btn.active {
            border-color: var(--time-color);
            color: var(--time-color);
            background: #e1f5fe;
        }

        .score-board { font-weight: bold; font-size: 1.2rem; margin-bottom: 1rem; color: #7f8c8d; }

        .challenge-box {
            background: #fdfdfd;
            border: 2px dashed #bdc3c7;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
        }

        .chinese-text { font-size: 1.4rem; font-weight: bold; margin-bottom: 0.5rem; color: #2980b9; }
        .base-verb { font-style: italic; color: #7f8c8d; }

        .block-section { margin-bottom: 1rem; }
        .block-label { font-size: 0.9rem; font-weight: bold; margin-bottom: 0.5rem; display: block; color: #95a5a6; }
        
        .blocks {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .block {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: var(--shadow);
        }

        .time-block { background-color: #e1f5fe; color: var(--time-color); border: 2px solid var(--time-color); }
        .time-block.selected { background-color: var(--time-color); color: white; transform: translateY(-3px); }

        .aspect-block { background-color: #fff3e0; color: var(--aspect-color); border: 2px solid var(--aspect-color); }
        .aspect-block.selected { background-color: var(--aspect-color); color: white; transform: translateY(-3px); }

        .display-area {
            margin: 1rem 0;
            padding: 1.5rem;
            background: #f9f9f9;
            border-radius: 10px;
            min-height: 120px;
            border: 2px solid #ecf0f1;
        }

        .formula { font-family: 'Courier New', Courier, monospace; font-weight: bold; color: #16a085; font-size: 1.1rem; margin-bottom: 15px; }
        
        .word-bank, .sentence-assembly {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
            min-height: 50px;
        }

        .sentence-assembly {
            padding: 15px;
            background: #fff;
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            justify-content: flex-start;
        }

        .word-btn {
            padding: 8px 15px;
            background: white;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .word-btn.used { opacity: 0.3; cursor: default; pointer-events: none; }

        .assembly-word {
            padding: 8px 15px;
            background: #e1f5fe;
            border: 2px solid var(--time-color);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: var(--time-color);
        }

        .test-input {
            width: 90%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            margin-top: 10px;
        }
        .test-input:focus { border-color: var(--time-color); }

        .hidden { display: none !important; }

        .check-btn {
            background-color: var(--text-color);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .check-btn:hover { background-color: #34495e; }
        .check-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        .feedback {
            margin-top: 1rem;
            font-weight: bold;
            height: 24px;
        }

        .correct { color: var(--correct-color); }
        .wrong { color: var(--wrong-color); }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
        .animate-bounce { animation: bounce 1s; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🧩 English Tense Builder</h1>
    
    <div class="mode-selector">
        <button class="mode-btn active" id="mode-build" onclick="setMode('BUILD')">Build Mode (选词)</button>
        <button class="mode-btn" id="mode-type" onclick="setMode('TYPE')">Test Mode (拼写)</button>
    </div>

    <div class="score-board">Score: <span id="score">0</span></div>

    <div class="challenge-box">
        <div class="chinese-text" id="target-chinese">...</div>
        <div class="base-verb">Base Verb: <strong id="base-verb">...</strong></div>
    </div>

    <div class="block-section">
        <span class="block-label">1. SELECT TIME (选择时间)</span>
        <div class="blocks" id="time-blocks">
            <button class="block time-block" data-time="Present">Present (现在)</button>
            <button class="block time-block" data-time="Past">Past (过去)</button>
            <button class="block time-block" data-time="Future">Future (将来)</button>
        </div>
    </div>

    <div class="block-section">
        <span class="block-label">2. SELECT ASPECT (选择状态)</span>
        <div class="blocks" id="aspect-blocks">
            <button class="block aspect-block" data-aspect="Simple">Simple (一般)</button>
            <button class="block aspect-block" data-aspect="Continuous">Continuous (进行)</button>
            <button class="block aspect-block" data-aspect="Perfect">Perfect (完成)</button>
            <button class="block aspect-block" data-aspect="Perfect Continuous">Perfect Continuous (完成进行)</button>
        </div>
    </div>

    <div class="display-area">
        <div id="tense-feedback-area">
            <div id="placeholder-text" style="color: #bdc3c7; line-height: 80px;">← Please choose Time & Aspect first</div>
            <div id="formula-section" class="hidden">
                <div style="font-size: 0.8rem; color: #7f8c8d; margin-bottom: 5px;">Universal Formula (万能公式)</div>
                <div class="formula" id="formula-display">...</div>
                
                <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
                
                <div style="font-size: 0.8rem; color: #7f8c8d; margin-bottom: 5px;" id="stage-3-label">3. Build the Sentence (拼写例句)</div>
                
                <div id="build-area">
                    <div class="sentence-assembly" id="sentence-assembly"></div>
                    <div class="word-bank" id="word-bank"></div>
                </div>

                <div id="typing-area" class="hidden">
                    <input type="text" id="test-input" class="test-input" placeholder="Type the full English sentence here..." autocomplete="off">
                </div>
            </div>
        </div>
    </div>

    <button id="check-btn" class="check-btn">Verify Tense</button>
    <div id="feedback" class="feedback"></div>
</div>

<script>
    const scenarios = [
        { cn: "我每天学习。(习惯)", verb: "study", time: "Present", aspect: "Simple", formula: "do/does (动词原形/三单形式)", sentence: "I study every day" },
        { cn: "我正在学习。(进行)", verb: "study", time: "Present", aspect: "Continuous", formula: "am/is/are + doing (正在做...)", sentence: "I am studying now" },
        { cn: "我已经学过这个了。(完成)", verb: "study", time: "Present", aspect: "Perfect", formula: "have/has + done (已经完成/做过)", sentence: "I have studied this" },
        { cn: "我已经学习两小时了。(持续过程)", verb: "study", time: "Present", aspect: "Perfect Continuous", formula: "have/has been + doing (一直都在做...)", sentence: "I have been studying for two hours" },
        
        { cn: "我昨天学习了。(过去动作)", verb: "study", time: "Past", aspect: "Simple", formula: "did (动词过去式)", sentence: "I studied yesterday" },
        { cn: "我那时正在学习。(过去正在进行)", verb: "study", time: "Past", aspect: "Continuous", formula: "was/were + doing (那时正在做...)", sentence: "I was studying at that time" },
        { cn: "在他来之前，我已经学过了。(过去的过去)", verb: "study", time: "Past", aspect: "Perfect", formula: "had + done (在过去某点前已完成)", sentence: "I had studied before he came" },
        { cn: "在他来之前，我一直在学习。(过去的持续)", verb: "study", time: "Past", aspect: "Perfect Continuous", formula: "had been + doing (在过去某点前一直在做)", sentence: "I had been studying before he came" },
        
        { cn: "我明天会学习。(将要发生)", verb: "study", time: "Future", aspect: "Simple", formula: "will + do (将要去做...)", sentence: "I will study tomorrow" },
        { cn: "我明天这个时候会正在学习。(将来正在进行)", verb: "study", time: "Future", aspect: "Continuous", formula: "will be + doing (将来某个时刻正在做)", sentence: "I will be studying at this time tomorrow" },
        { cn: "到明天为止，我将已经学完了。(将来完成)", verb: "study", time: "Future", aspect: "Perfect", formula: "will have + done (到将来某点已经完成)", sentence: "I will have studied by tomorrow" },
        { cn: "到明天为止，我将已经学了三小时了。(将来持续)", verb: "study", time: "Future", aspect: "Perfect Continuous", formula: "will have been + doing (到将来某点已经持续做了多久)", sentence: "I will have been studying for three hours" }
    ];

    const distractors = ["doing", "does", "been", "was", "were", "has", "have", "had", "will", "be", "am", "is", "are", "did", "studied", "studying"];

    let currentScenario = {};
    let selectedTime = null;
    let selectedAspect = null;
    let score = 0;
    let gameStage = 'TENSE'; 
    let gameMode = 'BUILD'; // 'BUILD' or 'TYPE'
    let builtSentence = [];

    const targetChinese = document.getElementById('target-chinese');
    const baseVerb = document.getElementById('base-verb');
    const formulaDisplay = document.getElementById('formula-display');
    const wordBank = document.getElementById('word-bank');
    const sentenceAssembly = document.getElementById('sentence-assembly');
    const feedback = document.getElementById('feedback');
    const checkBtn = document.getElementById('check-btn');
    const scoreEl = document.getElementById('score');
    const formulaSection = document.getElementById('formula-section');
    const placeholderText = document.getElementById('placeholder-text');
    const buildArea = document.getElementById('build-area');
    const typingArea = document.getElementById('typing-area');
    const testInput = document.getElementById('test-input');
    const stage3Label = document.getElementById('stage-3-label');

    function setMode(mode) {
        gameMode = mode;
        document.getElementById('mode-build').classList.toggle('active', mode === 'BUILD');
        document.getElementById('mode-type').classList.toggle('active', mode === 'TYPE');
        nextScenario();
    }

    function initGame() {
        nextScenario();
        
        document.querySelectorAll('.time-block').forEach(btn => {
            btn.addEventListener('click', () => {
                if (gameStage !== 'TENSE') return;
                document.querySelectorAll('.time-block').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedTime = btn.dataset.time;
                checkReady();
            });
        });

        document.querySelectorAll('.aspect-block').forEach(btn => {
            btn.addEventListener('click', () => {
                if (gameStage !== 'TENSE') return;
                document.querySelectorAll('.aspect-block').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedAspect = btn.dataset.aspect;
                checkReady();
            });
        });

        checkBtn.addEventListener('click', handleMainAction);
        
        testInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && gameStage === 'SENTENCE') {
                verifySentence();
            }
        });
    }

    function checkReady() {
        if (selectedTime && selectedAspect) {
            placeholderText.style.display = 'none';
            checkBtn.disabled = false;
        }
    }

    function nextScenario() {
        const randomIndex = Math.floor(Math.random() * scenarios.length);
        currentScenario = scenarios[randomIndex];
        targetChinese.innerText = currentScenario.cn;
        baseVerb.innerText = currentScenario.verb;
        
        selectedTime = null;
        selectedAspect = null;
        gameStage = 'TENSE';
        builtSentence = [];
        testInput.value = "";
        
        document.querySelectorAll('.block').forEach(b => {
            b.classList.remove('selected');
            b.style.opacity = "1";
        });
        
        feedback.innerText = "";
        feedback.className = "feedback";
        formulaSection.classList.add('hidden');
        placeholderText.style.display = 'block';
        placeholderText.innerText = "← Please choose Time & Aspect first";
        
        checkBtn.innerText = "Verify Tense";
        checkBtn.disabled = true;
        
        wordBank.innerHTML = "";
        sentenceAssembly.innerHTML = "";

        buildArea.classList.toggle('hidden', gameMode !== 'BUILD');
        typingArea.classList.toggle('hidden', gameMode !== 'TYPE');
        stage3Label.innerText = gameMode === 'BUILD' ? "3. Build the Sentence (选词拼写)" : "3. Type the Sentence (听写测试)";
    }

    function handleMainAction() {
        if (gameStage === 'TENSE') {
            verifyTense();
        } else if (gameStage === 'SENTENCE') {
            verifySentence();
        } else {
            nextScenario();
        }
    }

    function verifyTense() {
        if (selectedTime === currentScenario.time && selectedAspect === currentScenario.aspect) {
            feedback.innerText = "Tense Correct! Now complete the sentence.";
            feedback.className = "feedback correct";
            startSentenceStage();
        } else {
            feedback.innerText = "Wrong Tense. Look at the Chinese meaning again!";
            feedback.className = "feedback wrong";
        }
    }

    function startSentenceStage() {
        gameStage = 'SENTENCE';
        formulaSection.classList.remove('hidden');
        formulaDisplay.innerText = currentScenario.formula;
        checkBtn.innerText = "Check Answer";
        
        document.querySelectorAll('.block').forEach(b => b.style.opacity = "0.6");

        if (gameMode === 'BUILD') {
            const realWords = currentScenario.sentence.split(" ");
            const currentDistractors = distractors
                .filter(w => !realWords.includes(w))
                .sort(() => Math.random() - 0.5)
                .slice(0, 3);

            const allWords = [...realWords, ...currentDistractors].sort(() => Math.random() - 0.5);

            wordBank.innerHTML = "";
            allWords.forEach((word, index) => {
                const btn = document.createElement('button');
                btn.className = 'word-btn';
                btn.innerText = word;
                btn.onclick = () => addWord(word, btn);
                wordBank.appendChild(btn);
            });
        } else {
            testInput.focus();
        }
    }

    function addWord(word, btn) {
        builtSentence.push(word);
        btn.classList.add('used');
        
        const assemblyWord = document.createElement('div');
        assemblyWord.className = 'assembly-word';
        assemblyWord.innerText = word;
        assemblyWord.onclick = () => {
            const idx = builtSentence.lastIndexOf(word);
            if (idx > -1) builtSentence.splice(idx, 1);
            assemblyWord.remove();
            btn.classList.remove('used');
        };
        sentenceAssembly.appendChild(assemblyWord);
    }

    function verifySentence() {
        const target = currentScenario.sentence.toLowerCase().trim();
        let userSentence = "";

        if (gameMode === 'BUILD') {
            userSentence = builtSentence.join(" ").toLowerCase().trim();
        } else {
            userSentence = testInput.value.toLowerCase().trim().replace(/[.,!?;]$/, "");
        }

        if (userSentence === target) {
            score += 20;
            scoreEl.innerText = score;
            feedback.innerText = "Perfect! +20 Points! 🎉";
            feedback.className = "feedback correct animate-bounce";
            checkBtn.innerText = "Next Challenge →";
            gameStage = 'NEXT';
        } else {
            feedback.innerText = gameMode === 'BUILD' ? "Sentence incorrect. Check order!" : "Incorrect typing. Try again!";
            feedback.className = "feedback wrong";
        }
    }

    initGame();
</script>

</body>
</html>
