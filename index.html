<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JTW 360 | 汕尾金町湾全能向导</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind 配置：恢复深色模式与颜色定义
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1', // 靛蓝色主色
                        success: '#10b981', // 绿色功能色
                    },
                    backgroundImage: {
                        'gradient-light': 'linear-gradient(to bottom right, #f1f5f9, #e2e8f0)',
                        'gradient-dark': 'linear-gradient(to bottom right, #0f172a, #1e293b)',
                    }
                },
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .no-scrollbar::-webkit-scrollbar { display: none; }
            .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
            .text-gradient { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
            /* 核心修复：玻璃拟态样式 */
            .bg-glass {
                @apply bg-white/70 dark:bg-slate-800/70 backdrop-blur-md border border-slate-200/50 dark:border-slate-700/50;
            }
            .transition-all-300 { @apply transition-all duration-300 ease-in-out; }
        }
    </style>
    <style>
        /* 基础背景与动画 */
        body { font-family: -apple-system, system-ui, sans-serif; }
        .spot-content { max-height: 0; overflow: hidden; transition: max-height 0.5s ease-out; }
        .spot-content.open { max-height: 5000px; transition: max-height 1s ease-in; }
        html { scroll-behavior: smooth; }
        
        /* 图片灯箱动画 */
        #lightbox { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #lightbox-img { animation: scaleIn 0.3s ease; }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-gradient-light dark:bg-gradient-dark text-slate-800 dark:text-slate-200 min-h-screen">

    <!-- 顶部操作栏（胶囊型 + 玻璃态） -->
    <div class="fixed top-4 right-4 z-50 flex gap-2">
        <div class="bg-glass rounded-full px-3 py-1 flex items-center gap-2 text-sm">
            <button id="themeToggle" class="transition-all-300 hover:text-primary dark:hover:text-primary">
                <i class="fas fa-moon dark:hidden"></i>
                <i class="fas fa-sun hidden dark:block"></i>
            </button>
            <button class="transition-all-300 hover:text-primary dark:hover:text-primary">
                <i class="fas fa-globe"></i>
            </button>
        </div>
    </div>

    <!-- 头部区域 -->
    <header class="pt-20 pb-16 px-6 rounded-b-3xl bg-gradient-to-r from-primary/90 to-primary dark:from-primary/80 dark:to-primary/90 text-white">
        <h1 class="text-[clamp(1.75rem,4vw,2rem)] font-extrabold mb-2">JTW 360</h1>
        <p class="text-white/90 text-sm">汕尾金町湾 · 本地生活导览助手</p>
    </header>

    <!-- 信息栏（玻璃拟态） -->
    <div class="mx-6 mt-[-25px] bg-glass rounded-2xl p-4 shadow-lg text-sm flex flex-wrap justify-between gap-2">
        <span class="flex-1 min-w-[120px]">🌊 今日潮汐：<span class="text-orange-500 dark:text-orange-400 font-bold">16:30 低潮</span></span>
        <span class="flex-1 min-w-[120px]">☀️ 汕尾：28°C 晴</span>
    </div>

    <!-- 基础服务板块 -->
    <section class="mt-8">
        <h2 class="px-6 py-2 text-lg font-bold flex items-center gap-2">
            <i class="fas fa-server text-primary"></i> 基础服务
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 px-6 mt-2">
            <a href="https://uri.amap.com/marker?position=115.292562,22.795063&name=金町湾公共厕所" 
               class="bg-glass rounded-2xl p-6 text-center text-slate-700 dark:text-slate-200 no-underline transition-all-300 hover:scale-[1.02] hover:shadow-md">
                <i class="fas fa-toilet text-2xl block mb-2 bg-gradient-to-r from-primary to-purple-500 text-gradient"></i>
                <span>找厕所</span>
            </a>
            <a href="https://uri.amap.com/marker?position=115.292173,22.795188&name=金町湾免费停车场" 
               class="bg-glass rounded-2xl p-6 text-center text-slate-700 dark:text-slate-200 no-underline transition-all-300 hover:scale-[1.02] hover:shadow-md">
                <i class="fas fa-parking text-2xl block mb-2 bg-gradient-to-r from-primary to-purple-500 text-gradient"></i>
                <span>免费停车场</span>
            </a>
            <a href="https://uri.amap.com/marker?position=115.294262,22.796557&name=金町湾充电桩" 
               class="bg-glass rounded-2xl p-6 text-center text-slate-700 dark:text-slate-200 no-underline transition-all-300 hover:scale-[1.02] hover:shadow-md">
                <i class="fas fa-charging-station text-2xl block mb-2 bg-gradient-to-r from-primary to-purple-500 text-gradient"></i>
                <span>充电桩</span>
            </a>
            <a href="https://uri.amap.com/marker?position=115.303672,22.828743&name=红草卫生院" 
               class="bg-glass rounded-2xl p-6 text-center text-slate-700 dark:text-slate-200 no-underline transition-all-300 hover:scale-[1.02] hover:shadow-md">
                <i class="fas fa-user-md text-2xl block mb-2 bg-gradient-to-r from-primary to-purple-500 text-gradient"></i>
                <span>医疗救助</span>
            </a>
        </div>
    </section>

    <!-- 热门打卡点板块 -->
    <section class="mt-8">
        <!-- 标题栏使用玻璃态 -->
        <div class="mx-6 bg-glass rounded-3xl shadow-lg overflow-hidden">
            <div class="p-4 flex justify-between items-center cursor-pointer" onclick="toggleSpots()">
                <h2 class="text-lg font-bold flex items-center gap-2 text-orange-500 dark:text-orange-400">
                    <i class="fas fa-camera-retro"></i> 汕尾热门打卡点
                </h2>
                <i id="arrow" class="fas fa-chevron-down text-slate-400 dark:text-slate-500 transition-all-300"></i>
            </div>
            <!-- 内容区域使用更深一点的玻璃态/背景以区分层级 -->
            <div id="spotContent" class="spot-content bg-slate-50/80 dark:bg-slate-800/50 backdrop-blur-sm">
                <div class="p-2">
                    <!-- 金霞光森林公园 -->
                    <div class="flex gap-3 p-3 border-b border-slate-200/50 dark:border-slate-700/50 last:border-0">
                        <!-- 修复点：图片保持固定尺寸作为缩略图，增加 cursor-zoom-in -->
                        <img class="spot-img w-22 h-17 rounded-xl object-cover bg-slate-200 dark:bg-slate-700 cursor-zoom-in" 
                             loading="lazy" src="img/jinxia.jpg" alt="金霞光森林公园" onclick="openLightbox(this.src)">
                        <div class="flex-1">
                            <span class="block font-bold text-sm mb-1">金霞光森林公园</span>
                            <p class="text-xs text-slate-600 dark:text-slate-400 mb-2">步行可达，位于金亭村，首座滨海森林公园，山海境特色布局。</p>
                            <a href="https://uri.amap.com/marker?position=115.28309,22.801956&name=金霞光森林公园" 
                               class="inline-block bg-slate-100 dark:bg-slate-700 text-primary text-xs font-bold px-3 py-1 rounded-md no-underline transition-all-300 hover:bg-slate-200 dark:hover:bg-slate-600">
                                📍 立即导航
                            </a>
                        </div>
                    </div>

                    <!-- 马宫沙滩 (示例保留一个) -->
                    <div class="flex gap-3 p-3 border-b border-slate-200/50 dark:border-slate-700/50 last:border-0">
                        <img class="spot-img w-22 h-17 rounded-xl object-cover bg-slate-200 dark:bg-slate-700 cursor-zoom-in" 
                             loading="lazy" src="img/magong.jpg" alt="马宫沙滩" onclick="openLightbox(this.src)">
                        <div class="flex-1">
                            <span class="block font-bold text-sm mb-1">马宫沙滩 (8km)</span>
                            <p class="text-xs text-slate-600 dark:text-slate-400 mb-2">小众无人沙滩，海上吊桥拍照非常出片。</p>
                            <a href="https://uri.amap.com/marker?position=115.244504,22.784115&name=马宫沙滩" 
                               class="inline-block bg-slate-100 dark:bg-slate-700 text-primary text-xs font-bold px-3 py-1 rounded-md no-underline transition-all-300 hover:bg-slate-200 dark:hover:bg-slate-600">
                                📍 立即导航
                            </a>
                        </div>
                    </div>
                    <!-- 更多景点请按上述结构复制 -->
                </div>
            </div>
        </div>
    </section>

    <!-- 底部结构保持不变 -->
    <section class="mt-8">
        <h2 class="px-6 py-2 text-lg font-bold flex items-center gap-2">
            <i class="fas fa-shopping-bag text-primary"></i> 实用服务
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 px-6 mt-2">
            <a href="#" class="bg-glass rounded-2xl p-6 text-center text-slate-700 dark:text-slate-200 no-underline transition-all-300 hover:scale-[1.02] hover:shadow-md">
                <i class="fas fa-box-open text-2xl block mb-2 bg-gradient-to-r from-primary to-purple-500 text-gradient"></i>
                <span>外卖寄存点</span>
            </a>
            <a href="#" class="bg-glass rounded-2xl p-6 text-center text-slate-700 dark:text-slate-200 no-underline transition-all-300 hover:scale-[1.02] hover:shadow-md">
                <i class="fas fa-camera text-2xl block mb-2 bg-gradient-to-r from-primary to-purple-500 text-gradient"></i>
                <span>日落点</span>
            </a>
        </div>
    </section>

    <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center cursor-zoom-out" onclick="this.style.display='none'">
        <img id="lightbox-img" class="max-w-[90%] max-h-[80%] rounded-2xl shadow-2xl" src="">
    </div>

    <script>
        // 主题切换逻辑恢复
        const themeToggle = document.getElementById('themeToggle');
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const theme = savedTheme || systemTheme;
            if (theme === 'dark') document.documentElement.classList.add('dark');
        }
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // 交互逻辑
        function toggleSpots() {
            const content = document.getElementById('spotContent');
            const arrow = document.getElementById('arrow');
            content.classList.toggle('open');
            arrow.style.transform = content.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        }
        function openLightbox(src) {
            if(!src) return;
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = src;
            lightbox.style.display = 'flex';
            document.addEventListener('keydown', function(e) {
                if(e.key === 'Escape') lightbox.style.display = 'none';
            });
        }
        window.onload = initTheme;
    </script>
</body>
</html>
