<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashcard Studio Pro | JTW 360</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #007AFF;
            --primary-light: #E5F1FF;
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text-main: #1C1C1E;
            --text-sub: #8E8E93;
            --border: #E5E5EA;
            --shadow: 0 8px 30px rgba(0,0,0,0.06);
            --radius-lg: 24px;
            --radius-md: 16px;
        }
        
        body.dark-mode {
            --primary: #0A84FF;
            --primary-light: rgba(10, 132, 255, 0.15);
            --bg: #000000;
            --card: #1C1C1E;
            --text-main: #FFFFFF;
            --text-sub: #8E8E93;
            --border: #38383A;
            --shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            color: var(--text-main); 
            padding-bottom: 50px;
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }
        
        /* Header */
        .header { 
            background: var(--card);
            color: var(--text-main); 
            padding: 30px 20px; 
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 { 
            margin: 0; 
            font-size: 24px; 
            font-weight: 800; 
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 i { color: var(--primary); }
        
        .header-controls {
            display: flex;
            gap: 12px;
        }
        
        .btn-icon {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-icon:hover { background: var(--primary-light); color: var(--primary); }
        .btn-icon:active { transform: scale(0.9); }
        
        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        /* Upload Section */
        .upload-section {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 40px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            max-width: 800px;
            margin: 0 auto 30px;
            transition: transform 0.2s;
        }
        
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 50px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg);
        }
        
        .upload-area:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        
        .upload-icon {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        .upload-text {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        
        .upload-subtext {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary:hover { background: #005BB5; transform: translateY(-2px); }
        .btn-primary:active { transform: translateY(0); }
        
        /* Editor Section */
        .editor-section {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 30px;
        }
        
        /* Preview Area */
        .preview-area {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        
        .preview-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .preview-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
        }
        
        .preview-content {
            position: relative;
            background: var(--bg);
            border-radius: var(--radius-md);
            overflow: hidden;
            aspect-ratio: 4/3;
            border: 1px solid var(--border);
        }
        
        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* Control Panel */
        .control-panel {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        
        .control-section {
            margin-bottom: 25px;
        }
        
        .control-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 15px 0;
            color: var(--text-main);
            display: flex; align-items: center; gap: 8px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-sub);
        }
        
        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            font-size: 14px;
            color: var(--text-main);
            transition: all 0.2s;
            font-family: inherit;
        }
        .form-input:focus { outline: none; border-color: var(--primary); background: var(--card); }
        
        .color-picker {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        
        .color-option:hover { transform: scale(1.1); }
        .color-option.active { border-color: var(--text-main); box-shadow: 0 0 0 2px var(--card); }
        
        .export-btn {
            width: 100%;
            background: var(--text-main);
            color: var(--card);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        
        .export-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .export-btn:active { transform: translateY(0); }
        
        /* API Section */
        .api-section {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .api-row {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        .api-row > div { flex: 1; }
        
        .btn-outline {
            background: var(--bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-outline:hover { background: var(--border); }
        
        .btn-demo {
            background: #FF9500;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-demo:hover { background: #E08300; }
        
        .error-message {
            background: rgba(255, 59, 48, 0.1);
            border-left: 4px solid #FF3B30;
            color: #FF3B30;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 60px;
        }
        
        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Label Bubbles */
        .label-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            color: #1C1C1E;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: move;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            max-width: 160px;
            z-index: 10;
        }
        
        .label-bubble .part {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 4px;
            font-weight: 800;
        }
        
        .label-bubble .word {
            font-size: 15px;
            font-weight: 800;
        }
        
        .label-bubble .phonetic {
            font-size: 11px;
            color: #8E8E93;
            margin-top: 2px;
        }
        
        /* Pointers */
        .pointer-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background: var(--primary);
            border: 3px solid white;
            border-radius: 50%;
            cursor: move;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 5;
        }
        
        /* Connector Lines */
        .connector-line {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }
        
        @media (max-width: 900px) {
            .editor-section { grid-template-columns: 1fr; }
            .api-row { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1><i class="fas fa-layer-group"></i> Flashcard Studio Pro</h1>
        <div class="header-controls">
            <button class="btn-icon mode-toggle" onclick="toggleMode()" title="Toggle Theme">
                <i class="fas fa-moon"></i>
            </button>
            <button class="btn-icon lang-toggle" onclick="toggleLanguage()" title="Toggle Language">
                EN
            </button>
        </div>
    </header>

    <div class="container">
        <!-- API Section -->
        <div class="api-section">
            <div class="control-title" data-lang="模型设置" data-lang-en="Model Settings"><i class="fas fa-robot"></i> <span data-lang="AI 图像分析设置" data-lang-en="AI Image Analysis Settings">AI 图像分析设置</span></div>
            <div class="api-row">
                <div class="form-group" style="margin:0;">
                    <label class="form-label" data-lang="选择模型" data-lang-en="Select Model">选择模型</label>
                    <select class="form-input" id="modelSelect" onchange="saveModel()">
                        <option value="gemini-2.5-flash-lite" data-lang="Gemini 2.5 Flash-Lite (免费)" data-lang-en="Gemini 2.5 Flash-Lite (Free)">Gemini 2.5 Flash-Lite (免费)</option>
                        <option value="gemini-2.5-flash" selected data-lang="Gemini 2.5 Flash (免费)" data-lang-en="Gemini 2.5 Flash (Free)">Gemini 2.5 Flash (免费)</option>
                        <option value="gemini-2.5-pro" data-lang="Gemini 2.5 Pro (收费)" data-lang-en="Gemini 2.5 Pro (Paid)">Gemini 2.5 Pro (收费)</option>
                    </select>
                </div>
                <div class="form-group" style="margin:0;">
                    <label class="form-label" data-lang="API Key (可选)" data-lang-en="API Key (Optional)">API Key (可选)</label>
                    <input type="password" class="form-input" id="apiKeyInput" placeholder="输入 Google Gemini API Key" data-lang-placeholder="输入 Google Gemini API Key" data-lang-en-placeholder="Enter Google Gemini API Key">
                </div>
                <div style="display: flex; gap: 10px; margin-bottom: 2px;">
                    <button class="btn-outline" onclick="saveApiKey()" data-lang="保存" data-lang-en="Save"><i class="fas fa-save"></i> 保存</button>
                    <button class="btn-demo" onclick="useDemoMode()" data-lang="演示模式" data-lang-en="Demo Mode"><i class="fas fa-play-circle"></i> 演示模式</button>
                </div>
            </div>
            <div class="error-message" id="errorMessage"></div>
        </div>

        <!-- Upload Section -->
        <div class="upload-section" id="uploadSection">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon"><i class="fas fa-cloud-arrow-up"></i></div>
                <div class="upload-text" data-lang="上传场景图片" data-lang-en="Upload Scene Image">上传场景图片</div>
                <div class="upload-subtext" data-lang="支持 JPG, PNG. 点击或拖拽文件到此处" data-lang-en="Supports JPG, PNG. Click or drag files here">支持 JPG, PNG. 点击或拖拽文件到此处</div>
                <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                <button class="btn-primary"><i class="fas fa-image"></i> <span data-lang="选择图片" data-lang-en="Select Image">选择图片</span></button>
            </div>
        </div>

        <!-- Editor Section -->
        <div class="editor-section" id="editorSection" style="display: none;">
            <div class="preview-area">
                <div class="preview-header">
                    <h2 class="preview-title" data-lang="编辑预览" data-lang-en="Edit Preview">编辑预览</h2>
                    <button class="btn-outline" onclick="resetUpload()" style="padding: 6px 12px; font-size: 12px;"><i class="fas fa-redo"></i> <span data-lang="重新上传" data-lang-en="Re-upload">重新上传</span></button>
                </div>
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <div style="color: var(--text-sub); font-weight: 500;" data-lang="AI 正在分析图片元素..." data-lang-en="AI is analyzing image elements...">AI 正在分析图片元素...</div>
                </div>
                <div class="preview-content" id="previewContent">
                    <img id="previewImage" class="preview-image" src="" alt="Preview">
                </div>
            </div>

            <div class="control-panel">
                <div class="control-section">
                    <h3 class="control-title"><i class="fas fa-heading"></i> <span data-lang="闪卡信息" data-lang-en="Flashcard Info">闪卡信息</span></h3>
                    <div class="form-group">
                        <label class="form-label" data-lang="主标题" data-lang-en="Main Title">主标题</label>
                        <input type="text" class="form-input" id="chineseTitle" placeholder="如：海滩一日游">
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-lang="副标题 (英文)" data-lang-en="Subtitle (English)">副标题 (英文)</label>
                        <input type="text" class="form-input" id="englishTitle" placeholder="e.g. A Day at the Beach">
                    </div>
                </div>

                <div class="control-section">
                    <h3 class="control-title"><i class="fas fa-palette"></i> <span data-lang="视觉风格" data-lang-en="Visual Style">视觉风格</span></h3>
                    <div class="form-group">
                        <label class="form-label" data-lang="主题色" data-lang-en="Theme Color">主题色</label>
                        <div class="color-picker" id="titleColorPicker">
                            <div class="color-option active" style="background-color: #007AFF;" data-color="#007AFF"></div>
                            <div class="color-option" style="background-color: #FF3B30;" data-color="#FF3B30"></div>
                            <div class="color-option" style="background-color: #34C759;" data-color="#34C759"></div>
                            <div class="color-option" style="background-color: #FF9500;" data-color="#FF9500"></div>
                            <div class="color-option" style="background-color: #AF52DE;" data-color="#AF52DE"></div>
                            <div class="color-option" style="background-color: #1C1C1E;" data-color="#1C1C1E"></div>
                        </div>
                    </div>
                </div>

                <button class="export-btn" onclick="exportFlashcard()"><i class="fas fa-download"></i> <span data-lang="导出闪卡" data-lang-en="Export Flashcard">导出闪卡</span></button>
            </div>
        </div>
    </div>

    <script>
        let currentLanguage = 'zh';
        let currentImage = null;
        let apiKey = localStorage.getItem('flashcardApiKey') || '';
        let isDemoMode = false;
        let flashcardData = [];
        let selectedElement = null;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let selectedModel = localStorage.getItem('flashcardModel') || 'gemini-2.5-flash';

        function saveApiKey() {
            const input = document.getElementById('apiKeyInput');
            if (input.value.trim()) {
                apiKey = input.value.trim();
                localStorage.setItem('flashcardApiKey', apiKey);
                alert('API Key 保存成功！');
            } else {
                showError('请输入有效的 API Key');
            }
        }

        function saveModel() {
            const select = document.getElementById('modelSelect');
            selectedModel = select.value;
            localStorage.setItem('flashcardModel', selectedModel);
        }

        function useDemoMode() {
            isDemoMode = true;
            document.getElementById('apiKeyInput').value = '';
            alert('已开启演示模式，将使用模拟数据。');
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 4000);
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImage = e.target.result;
                    document.getElementById('previewImage').src = currentImage;
                    document.getElementById('uploadSection').style.display = 'none';
                    document.getElementById('editorSection').style.display = 'grid';
                    processImage(currentImage, file.type);
                };
                reader.readAsDataURL(file);
            }
        }

        function resetUpload() {
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('editorSection').style.display = 'none';
            document.getElementById('fileInput').value = '';
        }

        async function processImage(imageData, mimeType) {
            const loadingSpinner = document.querySelector('.loading-spinner');
            loadingSpinner.style.display = 'block';
            
            try {
                if (isDemoMode || !apiKey) {
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    flashcardData = generateDemoData();
                } else {
                    const base64 = imageData.split(',')[1];
                    flashcardData = await callGeminiAPI(base64, mimeType);
                }
                renderLabels();
            } catch (error) {
                console.error('API Error:', error);
                showError('处理图片失败，请检查 API Key 或使用演示模式');
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }

        async function callGeminiAPI(base64Image, mimeType) {
            const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + selectedModel + ':generateContent?key=' + apiKey, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { inlineData: { data: base64Image, mimeType: mimeType } },
                            { text: "Identify ALL significant elements in this image. For each element, provide: 1. The English word. 2. IPA phonetic transcription. 3. Chinese translation with Pinyin. 4. Precise [x, y] coordinates (0-100 percentage). Return as a JSON array with keys: part, word, phonetic, pinyin, x, y. Make x,y near the object." }
                        ]
                    }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            if (!response.ok) throw new Error('API Request Failed');
            const data = await response.json();
            let parsed = JSON.parse(data.candidates[0].content.parts[0].text || "[]");
            
            // Normalize data
            return parsed.map(item => ({
                part: item.part || 'Object',
                word: item.word || 'Unknown',
                phonetic: item.phonetic || '',
                labelX: item.x || 50,
                labelY: Math.max(0, (item.y || 50) - 15),
                pointerX: item.x || 50,
                pointerY: item.y || 50
            }));
        }

        function generateDemoData() {
            return [
                { part: "天空", word: "Sky", phonetic: "/skaɪ/", labelX: 50, labelY: 10, pointerX: 50, pointerY: 20 },
                { part: "海滩", word: "Beach", phonetic: "/biːtʃ/", labelX: 30, labelY: 60, pointerX: 30, pointerY: 70 },
                { part: "海浪", word: "Waves", phonetic: "/weɪvz/", labelX: 70, labelY: 65, pointerX: 70, pointerY: 75 }
            ];
        }

        function renderLabels() {
            const previewContent = document.querySelector('.preview-content');
            previewContent.querySelectorAll('.label-bubble, .pointer-dot, .connector-line').forEach(el => el.remove());
            
            let svg = previewContent.querySelector('svg');
            if (!svg) {
                svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.className = 'connector-line';
                svg.style.position = 'absolute';
                svg.style.top = '0'; svg.style.left = '0'; svg.style.width = '100%'; svg.style.height = '100%';
                previewContent.appendChild(svg);
            }
            svg.innerHTML = '';
            
            flashcardData.forEach((item, index) => {
                const bubble = document.createElement('div');
                bubble.className = 'label-bubble';
                bubble.style.left = item.labelX + '%'; bubble.style.top = item.labelY + '%';
                bubble.innerHTML = `<div class="part">${item.part}</div><div class="word">${item.word}</div><div class="phonetic">${item.phonetic}</div>`;
                bubble.dataset.index = index;
                bubble.addEventListener('mousedown', startDrag);
                previewContent.appendChild(bubble);
                
                const pointer = document.createElement('div');
                pointer.className = 'pointer-dot';
                pointer.style.left = item.pointerX + '%'; pointer.style.top = item.pointerY + '%';
                pointer.dataset.index = index;
                pointer.addEventListener('mousedown', startDrag);
                previewContent.appendChild(pointer);
                
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', item.labelX + '%'); line.setAttribute('y1', item.labelY + '%');
                line.setAttribute('x2', item.pointerX + '%'); line.setAttribute('y2', item.pointerY + '%');
                line.setAttribute('stroke', 'var(--primary)');
                line.setAttribute('stroke-width', '2');
                line.setAttribute('stroke-dasharray', '4 4');
                line.setAttribute('opacity', '0.8');
                line.dataset.index = index;
                svg.appendChild(line);
            });
        }

        function startDrag(e) {
            e.preventDefault();
            selectedElement = e.target.closest('.label-bubble') || e.target;
            if(!selectedElement.dataset.index) return;
            isDragging = true;
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
        }

        function drag(e) {
            if (!isDragging || !selectedElement) return;
            const rect = document.querySelector('.preview-content').getBoundingClientRect();
            let x = ((e.clientX - rect.left) / rect.width) * 100;
            let y = ((e.clientY - rect.top) / rect.height) * 100;
            x = Math.max(0, Math.min(100, x)); y = Math.max(0, Math.min(100, y));
            
            const idx = parseInt(selectedElement.dataset.index);
            const line = document.querySelector(`line[data-index="${idx}"]`);
            
            if (selectedElement.classList.contains('label-bubble')) {
                flashcardData[idx].labelX = x; flashcardData[idx].labelY = y;
                selectedElement.style.left = x + '%'; selectedElement.style.top = y + '%';
                if (line) { line.setAttribute('x1', x + '%'); line.setAttribute('y1', y + '%'); }
            } else if (selectedElement.classList.contains('pointer-dot')) {
                flashcardData[idx].pointerX = x; flashcardData[idx].pointerY = y;
                selectedElement.style.left = x + '%'; selectedElement.style.top = y + '%';
                if (line) { line.setAttribute('x2', x + '%'); line.setAttribute('y2', y + '%'); }
            }
        }

        function stopDrag() {
            isDragging = false; selectedElement = null;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDrag);
        }

        function toggleLanguage() {
            currentLanguage = currentLanguage === 'zh' ? 'en' : 'zh';
            document.querySelector('.lang-toggle').textContent = currentLanguage.toUpperCase();
            document.querySelectorAll('[data-lang], [data-lang-en]').forEach(el => {
                if (currentLanguage === 'zh') {
                    if (el.dataset.lang) el.textContent = el.dataset.lang;
                    if (el.dataset.langPlaceholder) el.placeholder = el.dataset.langPlaceholder;
                } else {
                    if (el.dataset.langEn) el.textContent = el.dataset.langEn;
                    if (el.dataset.langEnPlaceholder) el.placeholder = el.dataset.langEnPlaceholder;
                }
            });
        }

        function toggleMode() {
            document.body.classList.toggle('dark-mode');
            const icon = document.querySelector('.mode-toggle i');
            icon.className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        document.querySelectorAll('.color-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
                document.documentElement.style.setProperty('--primary', this.dataset.color);
            });
        });

        function exportFlashcard() {
            alert('导出功能已触发！(需要后端或 html2canvas 库支持)');
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (apiKey) document.getElementById('apiKeyInput').value = apiKey;
            if (selectedModel) document.getElementById('modelSelect').value = selectedModel;
        });
    </script>
</body>
</html>
